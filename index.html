      <Eyebrow style={{ margin: "18px 0 8px" }}>Notes</Eyebrow>
      <textarea value={form.notes} onChange={set("notes")} rows={3} placeholder="Where did this lead come from? Any context…"
        style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 13.5, background: "#fff", resize: "vertical" }} />

      <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
        <Btn kind="primary" onClick={() => { if (form.org.trim()) onSave({ ...form, org: form.org.trim(), email: form.email.trim().toLowerCase() }); }}
          style={{ opacity: form.org.trim() ? 1 : 0.45 }}>Save lead</Btn>
        <Btn kind="quiet" onClick={onCancel}>Cancel</Btn>
      </div>
    </div>
  );
}

/* ---------- deal flow diagram ---------- */
function DealFlowDiagram({ leads, pipeStage, setPipeStage }) {
  const [hover, setHover] = useState(null);
  const chain = STAGES.filter((s) => !["new", "closed"].includes(s.key));
  const lostCount = leads.filter(isLost).length;
  const wonCount = leads.filter(isWon).length;

  const N = chain.length;
  const nodeW = 128, nodeH = 76, gap = 22;
  const chainW = N * nodeW + (N - 1) * gap;
  const y = 8;
  const midY = y + nodeH / 2;
  const endW = 112, endH = 60;
  const endX = chainW + gap + 14;
  const wonY = y - 2;
  const lostY = y + nodeH - endH + 2 + 34;
  const viewW = endX + endW + 2;
  const viewH = lostY + endH + 12;

  return (
    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: "18px 20px 16px", marginBottom: 18 }}>
      <Eyebrow style={{ marginBottom: 12 }}>Deal flow — click a stage to jump to it</Eyebrow>
      <div style={{ width: "100%", overflowX: "auto" }}>
        <svg viewBox={`0 0 ${viewW} ${viewH}`} width="100%" style={{ minWidth: 680, height: "auto", display: "block" }}>
          <defs>
            <marker id="flowArr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill={C.line} />
            </marker>
            <marker id="flowArrWon" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill={C.emerald} />
            </marker>
            <marker id="flowArrLost" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="#C0492C" />
            </marker>
          </defs>

          {chain.slice(0, -1).map((s, i) => {
            const x1 = i * (nodeW + gap) + nodeW;
            return <line key={s.key} x1={x1} y1={midY} x2={x1 + gap - 3} y2={midY} stroke={C.line} strokeWidth="2.5" markerEnd="url(#flowArr)" />;
          })}

          {/* Price Proposal -> Won (up-right, solid emerald) */}
          <path d={`M ${chainW} ${midY - 12} L ${endX - 5} ${wonY + endH / 2}`} fill="none" stroke={C.emerald} strokeWidth="2.5" markerEnd="url(#flowArrWon)" />
          {/* Price Proposal -> Lost (down-right, dashed red) */}
          <path d={`M ${chainW} ${midY + 12} L ${endX - 5} ${lostY + endH / 2}`} fill="none" stroke="#C0492C" strokeWidth="2" strokeDasharray="5 5" opacity="0.7" markerEnd="url(#flowArrLost)" />

          {chain.map((s, i) => {
            const x = i * (nodeW + gap);
            const active = pipeStage === s.key;
            const isHover = hover === s.key;
            const count = leads.filter((l) => l.stage === s.key).length;
            return (
              <g key={s.key} onClick={() => setPipeStage(s.key)} onMouseEnter={() => setHover(s.key)} onMouseLeave={() => setHover(null)} style={{ cursor: "pointer" }}>
                <rect x={x} y={y} width={nodeW} height={nodeH} rx="12"
                  fill={active ? C.forest : "#FFFFFF"}
                  stroke={active ? "transparent" : isHover ? C.emerald : C.line}
                  strokeWidth={isHover && !active ? 2 : 1.5} />
                <text x={x + nodeW / 2} y={y + 32} textAnchor="middle" fontFamily={font.display} fontWeight="700" fontSize="24" fill={active ? C.salt : C.forest}>{count}</text>
                <text x={x + nodeW / 2} y={y + 54} textAnchor="middle" fontFamily={font.body} fontWeight="600" fontSize="11.5" letterSpacing="0.04em" fill={active ? C.salt : C.ink60} style={{ textTransform: "uppercase" }}>{s.label}</text>
              </g>
            );
          })}

          {/* WON node */}
          <g onClick={() => setPipeStage("won")} onMouseEnter={() => setHover("won")} onMouseLeave={() => setHover(null)} style={{ cursor: "pointer" }}>
            <rect x={endX} y={wonY} width={endW} height={endH} rx="12"
              fill={pipeStage === "won" ? C.emerald : "rgba(28,186,136,0.12)"}
              stroke={pipeStage === "won" ? "transparent" : hover === "won" ? C.emerald : C.line}
              strokeWidth={hover === "won" && pipeStage !== "won" ? 2 : 1.5} />
            <text x={endX + endW / 2} y={wonY + 27} textAnchor="middle" fontFamily={font.display} fontWeight="700" fontSize="20" fill={pipeStage === "won" ? "#fff" : C.deepEmerald}>{wonCount}</text>
            <text x={endX + endW / 2} y={wonY + 46} textAnchor="middle" fontFamily={font.body} fontWeight="600" fontSize="11.5" letterSpacing="0.04em" fill={pipeStage === "won" ? "#fff" : C.deepEmerald} style={{ textTransform: "uppercase" }}>Won</text>
          </g>

          {/* LOST node */}
          <g onClick={() => setPipeStage("lost")} onMouseEnter={() => setHover("lostN")} onMouseLeave={() => setHover(null)} style={{ cursor: "pointer" }}>
            <rect x={endX} y={lostY} width={endW} height={endH} rx="12"
              fill={pipeStage === "lost" ? "#C0492C" : "rgba(192,73,44,0.07)"}
              stroke={pipeStage === "lost" ? "transparent" : hover === "lostN" ? "#C0492C" : C.line}
              strokeWidth={hover === "lostN" && pipeStage !== "lost" ? 2 : 1.5} />
            <text x={endX + endW / 2} y={lostY + 27} textAnchor="middle" fontFamily={font.display} fontWeight="700" fontSize="20" fill={pipeStage === "lost" ? "#fff" : "#C0492C"}>{lostCount}</text>
            <text x={endX + endW / 2} y={lostY + 46} textAnchor="middle" fontFamily={font.body} fontWeight="600" fontSize="11.5" letterSpacing="0.04em" fill={pipeStage === "lost" ? "#fff" : "#C0492C"} style={{ textTransform: "uppercase" }}>Lost</text>
          </g>
        </svg>
      </div>
    </div>
  );
}

/* ---------- forecast ---------- */
function Forecast({ leads, allLeads, setOpenId }) {
  const open = leads.filter((l) => !isClosed(l));
  const wonAll = (allLeads || leads).filter(isWon);
  const wonRev = wonAll.reduce((a, l) => a + (l.dealValue || 0), 0);
  const WEIGHT = { Hot: 0.7, Warm: 0.4, Lukewarm: 0.15, Cool: 0.05, Cold: 0 };
  const byTemp = TEMPS.map((t) => {
    const g = open.filter((l) => l.temperature === t);
    const value = g.reduce((a, l) => a + (l.dealValue || 0), 0);
    return { name: t, count: g.length, value, weighted: value * (WEIGHT[t] || 0) };
  });
  const openValue = byTemp.reduce((a, r) => a + r.value, 0);
  const weighted = byTemp.reduce((a, r) => a + r.weighted, 0);
  const hot = byTemp.find((r) => r.name === "Hot") || { value: 0, count: 0 };
  const priced = open.filter((l) => l.dealValue).sort((a, b) => (b.dealValue || 0) - (a.dealValue || 0));
  const noValue = open.filter((l) => !l.dealValue && ["Hot", "Warm"].includes(l.temperature));
  const QORDER = ["Q4 25", "Q1 26", "Q2 26", "Q3 26", "Q4 26", "Q1 27"];
  const wonSorted = wonAll.slice().sort((a, b) => QORDER.indexOf(a.wonQuarter || "zz") - QORDER.indexOf(b.wonQuarter || "zz") || (b.dealValue || 0) - (a.dealValue || 0));

  const Section = ({ title, stat, statColor, children, note }) => (
    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "18px 18px 14px", marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 14, marginBottom: 12, flexWrap: "wrap" }}>
        <Eyebrow>{title}</Eyebrow>
        <span style={{ fontSize: 24, fontWeight: 700, color: statColor || C.forest, marginLeft: "auto" }}>{stat}</span>
      </div>
      {children}
      {note && <div style={{ fontSize: 12, color: C.ink40, marginTop: 10, lineHeight: 1.45 }}>{note}</div>}
    </div>
  );
  const th = { textAlign: "left", fontFamily: font.display, textTransform: "uppercase", letterSpacing: "0.08em", fontSize: 10.5, color: C.ink40, fontWeight: 600, padding: "6px 8px", borderBottom: `1px solid ${C.line}` };
  const thR = { ...th, textAlign: "right" };
  const td = { padding: "8px 8px", fontSize: 13, borderBottom: `1px solid ${C.faint}`, color: C.forest };
  const tdR = { ...td, textAlign: "right" };

  return (
    <div>
      {/* ===== 1. WON REVENUE ===== */}
      <Section title="Won revenue" stat={money(wonRev)} statColor={C.deepEmerald}
        note="Monthly contract value per customer. Opal includes the Q3 26 second contract.">
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr><th style={th}>Customer</th><th style={th}>Won</th><th style={thR}>Value p/m</th></tr></thead>
          <tbody>
            {wonSorted.map((l) => (
              <tr key={l.id} onClick={() => setOpenId(l.id)} style={{ cursor: "pointer" }}>
                <td style={{ ...td, fontWeight: 600 }}>{l.org}</td>
                <td style={{ ...td, color: C.ink60 }}>{l.wonQuarter || "—"}</td>
                <td style={{ ...tdR, fontWeight: 700, color: C.deepEmerald }}>{money(l.dealValue) || "—"}</td>
              </tr>
            ))}
            {wonSorted.length === 0 && <tr><td style={td} colSpan={3}>No won deals recorded yet.</td></tr>}
          </tbody>
        </table>
      </Section>

      {/* ===== 2. OPEN PIPELINE ===== */}
      <Section title="Open pipeline" stat={money(openValue)}
        note={`${priced.length} open deals carry a value · ${hot.count} are Hot (${money(hot.value)}). Click a row to open the lead.`}>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr><th style={th}>Organisation</th><th style={th}>Stage</th><th style={th}>Temp</th><th style={thR}>Value p/m</th></tr></thead>
          <tbody>
            {priced.slice(0, 14).map((l) => (
              <tr key={l.id} onClick={() => setOpenId(l.id)} style={{ cursor: "pointer" }}>
                <td style={{ ...td, fontWeight: 600 }}>{l.org}</td>
                <td style={{ ...td, color: C.ink60 }}>{STAGES[STAGE_IDX[l.stage] ?? 0].label}</td>
                <td style={{ ...td, color: TEMP_COLOR[l.temperature] || C.ink60, fontWeight: 600 }}>{l.temperature}</td>
                <td style={{ ...tdR, fontWeight: 700 }}>{money(l.dealValue)}</td>
              </tr>
            ))}
            {priced.length === 0 && <tr><td style={td} colSpan={4}>No deal values set yet.</td></tr>}
          </tbody>
        </table>
        {noValue.length > 0 && (
          <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.faint}` }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, color: C.red, marginBottom: 8 }}>Missing from this number — {noValue.length} warm-or-hotter deals with no value set:</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {noValue.slice(0, 16).map((l) => (
                <button key={l.id} onClick={() => setOpenId(l.id)} style={{ background: TEMP_BG[l.temperature], color: TEMP_COLOR[l.temperature], border: `1px solid ${C.line}`, borderRadius: 999, padding: "5px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: font.body }}>{l.org}</button>
              ))}
            </div>
          </div>
        )}
      </Section>

      {/* ===== 3. WEIGHTED FORECAST ===== */}
      <Section title="Weighted forecast" stat={money(Math.round(weighted))} statColor={C.emerald}
        note="Pipeline value discounted by how likely each temperature band is to close. Weightings are a starting assumption — Elliot should sanity-check them against how deals have actually converted.">
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "flex-start" }}>
          <div style={{ flex: "1 1 300px", minWidth: 0, height: 210 }}>
            <ResponsiveContainer>
              <BarChart data={byTemp} margin={{ top: 18, right: 8, left: -8, bottom: 0 }}>
                <XAxis dataKey="name" tick={{ fontSize: 11.5, fill: C.pine, fontFamily: "Inter" }} axisLine={{ stroke: C.line }} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: C.ink40 }} axisLine={false} tickLine={false} tickFormatter={(v) => "$" + (v / 1000) + "k"} />
                <Tooltip formatter={(v) => money(Math.round(v))} contentStyle={{ borderRadius: 10, border: `1px solid ${C.line}`, fontFamily: "Inter", fontSize: 13 }} />
                <Bar dataKey="value" radius={[6, 6, 0, 0]}>
                  {byTemp.map((d, i) => <Cell key={i} fill={TEMP_COLOR[d.name]} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
          <table style={{ flex: "1 1 280px", borderCollapse: "collapse" }}>
            <thead><tr><th style={th}>Band</th><th style={thR}>Pipeline</th><th style={thR}>Weight</th><th style={thR}>Counts as</th></tr></thead>
            <tbody>
              {byTemp.filter((r) => r.value > 0).map((r) => (
                <tr key={r.name}>
                  <td style={{ ...td, fontWeight: 600, color: TEMP_COLOR[r.name] }}>{r.name} ({r.count})</td>
                  <td style={tdR}>{money(r.value)}</td>
                  <td style={{ ...tdR, color: C.ink60 }}>{Math.round((WEIGHT[r.name] || 0) * 100)}%</td>
                  <td style={{ ...tdR, fontWeight: 700, color: C.emerald }}>{money(Math.round(r.weighted))}</td>
                </tr>
              ))}
              <tr>
                <td style={{ ...td, fontWeight: 700, borderBottom: "none" }}>Forecast</td>
                <td style={{ ...tdR, borderBottom: "none" }}>{money(openValue)}</td>
                <td style={{ ...tdR, borderBottom: "none" }}></td>
                <td style={{ ...tdR, fontWeight: 700, color: C.emerald, borderBottom: "none" }}>{money(Math.round(weighted))}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </Section>
    </div>
  );
}

/* ---------- insights ---------- */
function Insights({ leads }) {
  // CUMULATIVE funnel: how many leads have made it AT LEAST this far.
  // (A lead sitting at Priced Prop also counts in Contacted and Responded.)
  const reached = STAGES.filter((s) => !["new", "closed"].includes(s.key)).map((s) => ({
    name: s.label,
    count: leads.filter((l) => !isLost(l) && STAGE_IDX[l.stage] >= STAGE_IDX[s.key]).length,
  })).concat([{ name: "Won", count: leads.filter(isWon).length }, { name: "Lost", count: leads.filter(isLost).length }]);

  // CURRENT: where each deal sits right now — used by the suggestions below
  const open = leads.filter((l) => !isClosed(l));

  const mixData = [
    { name: "Untouched", value: leads.filter((l) => l.stage === "new").length, color: "rgba(0,26,19,0.18)" },
    { name: "In progress", value: leads.filter((l) => l.stage === "contacted").length, color: C.pine },
    { name: "Warm", value: leads.filter((l) => STAGE_IDX[l.stage] >= STAGE_IDX.responded && !isClosed(l)).length, color: C.emerald },
    { name: "Won", value: leads.filter(isWon).length, color: C.deepEmerald },
    { name: "Lost", value: leads.filter(isLost).length, color: "#C0492C" },
  ].filter((d) => d.value > 0);

  const sectorCounts = {};
  for (const l of leads) {
    if (isClosed(l) || STAGE_IDX[l.stage] < STAGE_IDX.responded) continue;
    const s = l.sector || "Unlabelled";
    sectorCounts[s] = (sectorCounts[s] || 0) + 1;
  }
  const sectorData = Object.entries(sectorCounts).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count).slice(0, 7);

  const contacted = reached.find((r) => r.name === "Contacted")?.count || 0;
  const responded = reached.find((r) => r.name === "Responded")?.count || 0;
  const demos = reached.find((r) => r.name === "Demo")?.count || 0;
  const proposals = reached.find((r) => r.name === "Price Proposal")?.count || 0;
  const won = leads.filter(isWon).length;
  const respRate = contacted ? Math.round((responded / contacted) * 100) : 0;
  const mtgRate = responded ? Math.round((demos / responded) * 100) : 0;
  const propToWin = proposals ? Math.round((won / proposals) * 100) : 0;

  const warm = open.filter((l) => STAGE_IDX[l.stage] >= STAGE_IDX.responded);

  // owner breakdown across open deals
  const ownerMap = {};
  for (const l of open) {
    const o = l.owner || "Unassigned";
    if (!ownerMap[o]) ownerMap[o] = { owner: o, open: 0, warm: 0, overdue: 0 };
    ownerMap[o].open++;
    if (STAGE_IDX[l.stage] >= STAGE_IDX.responded) ownerMap[o].warm++;
    const a = nextActionFor(l);
    if (a && !a.cold) ownerMap[o].overdue++;
  }
  const ownerRows = Object.values(ownerMap).sort((a, b) => b.warm - a.warm || b.open - a.open);
  const unassignedWarm = (ownerMap["Unassigned"] || {}).warm || 0;

  /* ================= Tier 1 suggestions engine =================
     Reasons across metrics instead of one at a time: stage-to-stage
     conversion, the worst bottleneck, velocity (once dates exist),
     owner patterns, sector signal. Each insight is scored by impact
     and the list is sorted so the biggest lever sits on top. */

  // adjacent-stage conversion from the cumulative funnel
  const chainNames = ["Contacted", "Responded", "Demo", "Price Proposal"];
  const reachedCount = (name) => reached.find((r) => r.name === name)?.count || 0;
  const steps = [];
  for (let i = 0; i < chainNames.length - 1; i++) {
    const from = reachedCount(chainNames[i]);
    const to = reachedCount(chainNames[i + 1]);
    if (from >= 4) steps.push({ from: chainNames[i], to: chainNames[i + 1], rate: Math.round((to / from) * 100), base: from, lost: from - to });
  }
  // won rate off proposals sits at the end of the chain
  if (proposals >= 4) steps.push({ from: "Price Proposal", to: "Won", rate: propToWin, base: proposals, lost: proposals - won });

  // velocity: only meaningful once Last touch has real dates
  const withDates = open.filter((l) => l.lastTouch);
  const haveDates = withDates.length >= Math.max(5, open.length * 0.3);

  const S = []; // {score, metric, headline, text}
  const push = (score, metric, headline, text) => S.push({ score, metric, headline, text });

  // 1. worst bottleneck in the funnel (the sharpest drop, weighted by how many leads sit above it)
  if (steps.length) {
    const worst = steps.slice().sort((a, b) => (a.rate - b.rate) || (b.base - a.base))[0];
    if (worst.rate < 60) {
      const where = worst.to === "Won" ? "closing priced proposals" : `getting from ${worst.from} to ${worst.to}`;
      push(100 - worst.rate + worst.base / 5, `${worst.rate}%`,
        `Biggest leak: ${worst.from} → ${worst.to}`,
        `Only ${worst.rate}% of ${worst.from} leads move to ${worst.to} — ${worst.lost} are stalling there. This is the single stage costing you the most deals right now. Focus this week on ${where} rather than filling the top of the funnel.`);
    }
  }

  // 2. stuck priced proposals — warmest money, ranked high
  const stuckProps = open.filter((l) => l.stage === "proposal" && daysSince(l.lastTouch) >= 7);
  if (stuckProps.length) {
    push(85 + stuckProps.length, stuckProps.length,
      "Chase the stalled proposals first",
      `price proposals have gone 7+ days with no answer. These are the warmest deals in the book — a focused chase here is the fastest path to revenue. They're queued at the top of Today.`);
  }

  // 3. velocity: deals sitting past the point where they usually convert
  if (haveDates) {
    const wonDeals = leads.filter((l) => isWon(l) && l.lastTouch);
    // rough "typical warm cycle": median days-since-touch of current warm deals as a proxy floor
    const warmAges = warm.filter((l) => l.lastTouch).map((l) => daysSince(l.lastTouch)).sort((a, b) => a - b);
    if (warmAges.length >= 5) {
      const median = warmAges[Math.floor(warmAges.length / 2)];
      const stale = warm.filter((l) => l.lastTouch && daysSince(l.lastTouch) > Math.max(21, median * 2));
      if (stale.length >= 3) {
        push(70 + stale.length, stale.length,
          "Deals going cold from age",
          `warm deals haven't been touched in over ${Math.max(21, median * 2)} days — well past your typical active window. Statistically these are slipping away. Either re-engage with a new angle now or mark them lost and free the attention for live ones.`);
      }
    }
  }

  // 4. owner pattern: a standout or a straggler on warm-deal conversion
  const namedOwners = ownerRows.filter((o) => o.owner !== "Unassigned" && o.warm >= 3);
  if (namedOwners.length >= 2) {
    const byWarm = namedOwners.slice().sort((a, b) => b.warm - a.warm);
    const overloaded = byWarm.find((o) => o.overdue >= 4 && o.overdue / o.warm > 0.5);
    if (overloaded) {
      push(60 + overloaded.overdue, overloaded.owner,
        "One owner is overloaded",
        `is carrying ${overloaded.warm} warm deals with ${overloaded.overdue} already overdue for action. Warm leads waiting on a busy owner go cold — redistribute a few, or clear their queue first in Today.`);
    }
  }
  if (unassignedWarm) {
    push(55 + unassignedWarm, unassignedWarm,
      "Warm leads with nobody on them",
      `warm leads have no owner. Unowned deals slip between people — assign each one so someone is accountable for the next step.`);
  }

  // 5. sector signal: where warm density is concentrated, aim the cold queue there
  if (sectorData.length >= 2 && sectorData[0].count >= 4) {
    const top = sectorData[0];
    const share = Math.round((top.count / warm.length) * 100);
    if (share >= 25) {
      push(45 + top.count, top.name,
        "Your warm pipeline leans one sector",
        `${share}% of warm leads are in ${top.name}. Whatever's resonating there is working — weight this week's cold outreach toward ${top.name} rather than spreading it evenly.`);
    }
  }

  // 6. earlier-funnel rates, lower priority than the bottleneck view
  if (contacted >= 10 && respRate < 35) {
    push(40, `${respRate}%`, "First-touch response is soft",
      `response rate on first outreach. Test a sharper hook — APCO membership deadlines and PREP reporting requirements land well as urgency angles.`);
  }
  if (responded >= 5 && mtgRate < 60) {
    push(38, `${mtgRate}%`, "Replies aren't becoming demos",
      `of people who reply get to a demo. You're winning interest then losing it to slow booking — put a calendar link in the first reply, not the third.`);
  }

  // 7. hygiene: missing emails, ghosts, cold-queue pacing (lowest priority)
  const noEmailWarm = warm.filter((l) => !l.email).length;
  if (noEmailWarm) push(30, noEmailWarm, "Warm leads with no email on file",
    `warm leads have no email address, so no reminder can fire for them. Hand this list to Monty (Apollo / Sales Nav) this week.`);
  const ghosts = open.filter((l) => (l.noReply || 0) >= 3).length;
  if (ghosts) push(28, ghosts, "Repeatedly ghosted leads",
    `leads have gone quiet 3+ times. Stop emailing — switch channel (LinkedIn, phone) or switch contact within the organisation.`);
  const untouched = leads.filter((l) => l.stage === "new").length;
  if (untouched > 50) push(20, untouched, "A deep cold bench",
    `leads are untouched. Don't blitz them — a steady ~10 first-touches a week keeps the funnel filling without burying the warm work.`);

  const suggestions = S.sort((a, b) => b.score - a.score);
  const dataThin = !haveDates;

  /* ---------- headline stats for the card grid ---------- */
  const lost = leads.filter(isLost).length;
  const wonRev = leads.filter(isWon).reduce((a, l) => a + (l.dealValue || 0), 0);
  const openValue = open.reduce((a, l) => a + (l.dealValue || 0), 0);
  const avgDeal = won ? Math.round(wonRev / won) : 0;
  const contactsCount = leads.filter((l) => l.first || l.last || l.email).length;
  const companiesCount = new Set(leads.map((l) => (l.org || "").toLowerCase().trim()).filter(Boolean)).size;
  const closedCount = leads.filter(isClosed).length;
  const winRate = closedCount ? Math.round((won / closedCount) * 100) : 0;
  const leadToWin = leads.length ? Math.round((won / leads.length) * 100) : 0;

  const activeFunnel = STAGES.filter((s) => s.key !== "closed").map((s) => ({
    name: s.key === "new" ? "New" : s.label,
    count: open.filter((l) => l.stage === s.key).length,
  }));
  const valueByStage = STAGES.filter((s) => !["new", "closed"].includes(s.key)).map((s) => ({
    name: s.label,
    value: open.filter((l) => l.stage === s.key).reduce((a, l) => a + (l.dealValue || 0), 0),
  }));
  const wonByQuarter = ["Q4 25", "Q1 26", "Q2 26", "Q3 26", "Q4 26", "Q1 27"]
    .map((q) => ({ name: q, value: leads.filter((l) => isWon(l) && l.wonQuarter === q).reduce((a, l) => a + (l.dealValue || 0), 0) }))
    .filter((d) => d.value > 0);

  const ico = (path) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round">{path}</svg>;
  const StatCard = ({ label, value, sub, icon, tint, tintBg }) => (
    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: "14px 16px 12px", minWidth: 0 }}>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8 }}>
        <Eyebrow style={{ paddingTop: 4 }}>{label}</Eyebrow>
        <span style={{ width: 32, height: 32, flex: "0 0 32px", borderRadius: 10, background: tintBg, color: tint, display: "grid", placeItems: "center" }}>{icon}</span>
      </div>
      <div style={{ fontSize: 26, fontWeight: 700, color: C.forest, lineHeight: 1.15 }}>{value}</div>
      <div style={{ fontSize: 12, color: C.ink40, marginTop: 2 }}>{sub}</div>
    </div>
  );

  const Panel = ({ title, sub, children, wide, note }) => (
    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: "16px 16px 12px", flex: wide ? "2 1 460px" : "1 1 320px", minWidth: 0 }}>
      <div style={{ fontSize: 14.5, fontWeight: 700, color: C.forest }}>{title}</div>
      {sub && <div style={{ fontSize: 12, color: C.ink40, marginTop: 2, marginBottom: 12 }}>{sub}</div>}
      {children}
      {note && <div style={{ fontSize: 12, color: C.ink40, marginTop: 8, lineHeight: 1.45 }}>{note}</div>}
    </div>
  );


  return (
    <div>
      {/* headline stat cards */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(215px, 1fr))", gap: 12, marginBottom: 14 }}>
        <StatCard label="Total leads" value={leads.length} sub={`${lost} lost`} tint={C.deepEmerald} tintBg="rgba(28,186,136,0.13)"
          icon={ico(<><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="4" /></>)} />
        <StatCard label="Deals won" value={won} sub={money(wonRev) || "$0"} tint={C.emerald} tintBg="rgba(28,186,136,0.13)"
          icon={ico(<><path d="M7 4h10v4a5 5 0 01-10 0V4z" /><path d="M7 5H4v2a3 3 0 003 3M17 5h3v2a3 3 0 01-3 3M12 13v4M8 21h8M12 17c-1.5 0-2.5 1.5-2.5 4h5c0-2.5-1-4-2.5-4z" /></>)} />
        <StatCard label="Open pipeline" value={money(openValue) || "$0"} sub="active value" tint={C.amber} tintBg="rgba(184,134,11,0.13)"
          icon={ico(<><rect x="3" y="7" width="18" height="13" rx="2" /><path d="M16 13.5h5M7 7V5a2 2 0 012-2h6a2 2 0 012 2v2" /></>)} />
        <StatCard label="Avg deal size" value={money(avgDeal) || "$0"} sub="won deals" tint="#5B7C8D" tintBg="rgba(91,124,141,0.13)"
          icon={ico(<><path d="M12 2v20M17 6.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 1.8 2.7 5 3.4c3.2.7 5 1.6 5 3.6s-2.2 3-5 3-5-1.1-5-3" /></>)} />
        <StatCard label="Contacts" value={contactsCount} sub="people on file" tint={C.deepEmerald} tintBg="rgba(28,186,136,0.13)"
          icon={ico(<><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5M16 4.7a3.5 3.5 0 010 6.6M17.5 14.7c2.3.7 4 2.3 4 5.3" /></>)} />
        <StatCard label="Companies" value={companiesCount} sub="organisations" tint={C.pine} tintBg="rgba(34,75,59,0.10)"
          icon={ico(<><path d="M4 21V5.5L12 3v18M12 8.5L20 11v10M4 21h16" /></>)} />
        <StatCard label="Win rate" value={winRate + "%"} sub="won vs closed" tint={C.emerald} tintBg="rgba(28,186,136,0.13)"
          icon={ico(<><path d="M19 5L5 19" /><circle cx="6.5" cy="6.5" r="2.5" /><circle cx="17.5" cy="17.5" r="2.5" /></>)} />
        <StatCard label="Lead → win" value={leadToWin + "%"} sub="overall conversion" tint={C.red} tintBg="rgba(192,73,44,0.10)"
          icon={ico(<><path d="M3 17l6-6 4 4 8-8" /><path d="M15 7h6v6" /></>)} />
      </div>

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>

        <Panel title="Pipeline funnel" sub="Active leads sitting in each stage right now" wide
          note="Where deals sit today — matches the counts in Pipeline and Companies. Won and Lost live in Pipeline's own tabs.">
          <div style={{ width: "100%", height: 250 }}>
            <ResponsiveContainer>
              <BarChart data={activeFunnel} margin={{ top: 18, right: 8, left: -18, bottom: 0 }}>
                <XAxis dataKey="name" tick={{ fontSize: 11, fill: C.pine, fontFamily: "Inter" }} axisLine={{ stroke: C.line }} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: C.ink40 }} axisLine={false} tickLine={false} allowDecimals={false} />
                <Tooltip contentStyle={{ borderRadius: 10, border: `1px solid ${C.line}`, fontFamily: "Inter", fontSize: 13 }} />
                <Bar dataKey="count" radius={[6, 6, 0, 0]}>
                  {activeFunnel.map((d, i) => (
                    <Cell key={i} fill={d.name === "New" ? "rgba(0,26,19,0.22)" : C.emerald} fillOpacity={d.name === "New" ? 1 : 1 - i * 0.09} />
                  ))}
                  <LabelList dataKey="count" position="top" style={{ fontSize: 12, fontWeight: 700, fill: C.forest, fontFamily: "Inter" }} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Panel>

        <Panel title="Pipeline mix" sub="Where the whole book stands">
          <div style={{ width: "100%", height: 220 }}>
            <ResponsiveContainer>
              <PieChart>
                <Pie data={mixData} dataKey="value" nameKey="name" innerRadius={50} outerRadius={82} paddingAngle={2} stroke={C.salt} strokeWidth={2}>
                  {mixData.map((d, i) => <Cell key={i} fill={d.color} />)}
                </Pie>
                <Tooltip contentStyle={{ borderRadius: 10, border: `1px solid ${C.line}`, fontFamily: "Inter", fontSize: 13 }} />
              </PieChart>
            </ResponsiveContainer>
          </div>
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", padding: "4px 0 6px" }}>
            {mixData.map((d) => (
              <span key={d.name} style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, color: C.pine }}>
                <span style={{ width: 9, height: 9, borderRadius: 99, background: d.color }} /> {d.name} · {d.value}
              </span>
            ))}
          </div>
        </Panel>

        <Panel title="Won revenue over time" sub="Deals won by quarter, monthly contract value">
          {wonByQuarter.length > 0 ? (
            <div style={{ width: "100%", height: 220 }}>
              <ResponsiveContainer>
                <BarChart data={wonByQuarter} margin={{ top: 18, right: 8, left: -8, bottom: 0 }}>
                  <XAxis dataKey="name" tick={{ fontSize: 11.5, fill: C.pine, fontFamily: "Inter" }} axisLine={{ stroke: C.line }} tickLine={false} />
                  <YAxis tick={{ fontSize: 11, fill: C.ink40 }} axisLine={false} tickLine={false} tickFormatter={(v) => "$" + (v / 1000) + "k"} />
                  <Tooltip formatter={(v) => money(v)} contentStyle={{ borderRadius: 10, border: `1px solid ${C.line}`, fontFamily: "Inter", fontSize: 13 }} />
                  <Bar dataKey="value" fill={C.deepEmerald} radius={[6, 6, 0, 0]}>
                    <LabelList dataKey="value" position="top" formatter={(v) => "$" + (v / 1000) + "k"} style={{ fontSize: 11.5, fontWeight: 700, fill: C.forest, fontFamily: "Inter" }} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          ) : <div style={{ fontSize: 13, color: C.ink60, padding: "20px 0" }}>No won deals with a quarter recorded yet.</div>}
        </Panel>

        <Panel title="Value by stage" sub="Open deal value sitting in each stage">
          <div style={{ width: "100%", height: 220 }}>
            <ResponsiveContainer>
              <BarChart data={valueByStage} margin={{ top: 18, right: 8, left: -8, bottom: 0 }}>
                <XAxis dataKey="name" tick={{ fontSize: 11, fill: C.pine, fontFamily: "Inter" }} axisLine={{ stroke: C.line }} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: C.ink40 }} axisLine={false} tickLine={false} tickFormatter={(v) => "$" + (v / 1000) + "k"} />
                <Tooltip formatter={(v) => money(v)} contentStyle={{ borderRadius: 10, border: `1px solid ${C.line}`, fontFamily: "Inter", fontSize: 13 }} />
                <Bar dataKey="value" fill={C.pine} radius={[6, 6, 0, 0]}>
                  <LabelList dataKey="value" position="top" formatter={(v) => v ? "$" + (v / 1000) + "k" : ""} style={{ fontSize: 11.5, fontWeight: 700, fill: C.forest, fontFamily: "Inter" }} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Panel>
      </div>
    </div>
  );
}
function LeadDetail({ lead, update, setStage, openDraft, snooze, logAction, onAi }) {
  const a = nextActionFor(lead);
  const field = (label, key, placeholder) => (
    <div style={{ flex: "1 1 45%" }}>
      <label style={{ fontSize: 11.5, fontWeight: 600, color: C.ink40, textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: font.display }}>{label}</label>
      <input value={lead[key] || ""} placeholder={placeholder} onChange={(e) => update(lead.id, { [key]: e.target.value })}
        style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 13.5, marginTop: 3, background: "#fff" }} />
    </div>
  );
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <h2 style={{ fontFamily: font.display, fontSize: 24, margin: 0, fontWeight: 700 }}>{lead.org}</h2>
        <StageChip stage={lead.stage} outcome={lead.outcome} />
      </div>
      <div style={{ margin: "10px 0 4px" }}><StageDots stage={lead.stage} outcome={lead.outcome} /></div>

      {a && (
        <div style={{ background: "rgba(28,186,136,0.1)", border: `1px solid rgba(28,186,136,0.35)`, borderRadius: 10, padding: "10px 14px", margin: "14px 0", fontSize: 13.5 }}>
          <b style={{ color: C.deepEmerald }}>{a.verb}.</b> {a.why(a.days)}
          <div style={{ marginTop: 8, display: "flex", gap: 6, flexWrap: "wrap" }}>
            <Btn kind="primary" small onClick={() => openDraft(lead, a.template)}>{actionLabel(a.template)}</Btn>
          </div>
        </div>
      )}
      {(lead.noReply || 0) >= 3 && !isClosed(lead) && (
        <div style={{ margin: "12px 0" }}>
          <div style={{ fontSize: 12.5, color: C.red, marginBottom: 6 }}>Gone quiet {lead.noReply} times — worth a fresh angle.</div>
          <Btn small onClick={onAi} style={{ color: C.deepEmerald }}>✨ AI suggest</Btn>
        </div>
      )}
      <div style={{ fontSize: 12, color: C.ink40, marginTop: 4 }}>
        {lead.createdAt ? `Added ${fmtTs(lead.createdAt)}` : ""}{lead.lastTouch ? ` · Last touch ${fmtTs(lead.lastTouch)}` : " · No touch logged yet"}
      </div>

      <Eyebrow style={{ margin: "18px 0 8px" }}>Deal stage</Eyebrow>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        {STAGES.filter((s) => s.key !== "closed").map((s) => (
          <Btn key={s.key} small kind={!isClosed(lead) && lead.stage === s.key ? "dark" : "ghost"} onClick={() => setStage(lead.id, s.key)}>{s.label}</Btn>
        ))}
        <Btn small kind={isWon(lead) ? "dark" : "ghost"} onClick={() => setStage(lead.id, "closed", "Won")} style={isWon(lead) ? {} : { color: C.deepEmerald }}>Won</Btn>
        <Btn small kind={isLost(lead) ? "dark" : "ghost"} onClick={() => setStage(lead.id, "closed", "Lost")} style={isLost(lead) ? {} : { color: C.red }}>Lost</Btn>
      </div>

      <Eyebrow style={{ margin: "20px 0 8px" }}>Forecast</Eyebrow>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 45%" }}>
          <label style={{ fontSize: 11.5, fontWeight: 600, color: C.ink40, textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: font.display }}>Target quarter</label>
          <select value={lead.targetQuarter || ""} onChange={(e) => update(lead.id, { targetQuarter: e.target.value })}
            style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 13.5, marginTop: 3, background: "#fff" }}>
            <option value="">Not set</option>
            {QUARTERS.map((q) => <option key={q}>{q}</option>)}
          </select>
        </div>
        <div style={{ flex: "1 1 45%" }}>
          <label style={{ fontSize: 11.5, fontWeight: 600, color: C.ink40, textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: font.display }}>Deal value (p/m)</label>
          <input type="number" value={lead.dealValue || ""} placeholder="e.g. 3500" onChange={(e) => update(lead.id, { dealValue: e.target.value ? Number(e.target.value) : null })}
            style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 13.5, marginTop: 3, background: "#fff" }} />
        </div>
        {isWon(lead) && (
          <div style={{ flex: "1 1 45%" }}>
            <label style={{ fontSize: 11.5, fontWeight: 600, color: C.ink40, textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: font.display }}>Won quarter</label>
            <select value={lead.wonQuarter || ""} onChange={(e) => update(lead.id, { wonQuarter: e.target.value })}
              style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 13.5, marginTop: 3, background: "#fff" }}>
              <option value="">Not set</option>
              {["Q4 25", "Q1 26", "Q2 26", "Q3 26", "Q4 26", "Q1 27"].map((q) => <option key={q}>{q}</option>)}
            </select>
          </div>
        )}
      </div>

      <Eyebrow style={{ margin: "20px 0 8px" }}>Details</Eyebrow>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        {field("First name", "first")}
        {field("Surname", "last")}
        {field("Job title", "title")}
        {field("Email", "email", "add an email to unlock drafts")}
        {field("Sector", "sector")}
        <div style={{ flex: "1 1 45%" }}>
          <label style={{ fontSize: 11.5, fontWeight: 600, color: C.ink40, textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: font.display }}>Owner</label>
          <select value={lead.owner} onChange={(e) => update(lead.id, { owner: e.target.value })} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 13.5, marginTop: 3, background: "#fff" }}>
            {OWNERS.map((o) => <option key={o}>{o}</option>)}
          </select>
        </div>
      </div>
      {lead.other && <div style={{ fontSize: 12.5, color: C.ink60, marginTop: 8 }}>Other contacts: {lead.other}</div>}

      <Eyebrow style={{ margin: "20px 0 8px" }}>Notes</Eyebrow>
      <textarea value={lead.notes || ""} onChange={(e) => update(lead.id, { notes: e.target.value })} rows={3} placeholder="Context, blockers, who else is involved…"
        style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 13.5, background: "#fff", resize: "vertical" }} />

      <div style={{ display: "flex", gap: 8, margin: "16px 0", flexWrap: "wrap" }}>
        <Btn small onClick={() => snooze(lead.id, 7)}>Snooze 1 wk</Btn>
        <Btn small onClick={() => { const n = prompt("Log an activity (call, meeting, LinkedIn…)"); if (n) logAction(lead.id, n); }}>Log activity</Btn>
      </div>

      <Eyebrow style={{ margin: "16px 0 8px" }}>History</Eyebrow>
      <div style={{ display: "grid", gap: 6 }}>
        {(lead.log || []).length === 0 && <div style={{ fontSize: 13, color: C.ink40 }}>No activity logged yet.</div>}
        {(lead.log || []).map((e, i) => (
          <div key={i} style={{ fontSize: 13, display: "flex", gap: 10 }}>
            <span style={{ color: C.ink40, flexShrink: 0, fontVariantNumeric: "tabular-nums" }}>{fmtTs(e.ts || e.date)}</span>
            <span style={{ color: C.pine }}>{e.note}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PhantmCRM />);

</script></body></html>
