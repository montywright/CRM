const today = () => new Date().toISOString().slice(0, 10);

const fmtTs = (ts) => {
  if (!ts) return "";
  const d = new Date(ts);
  if (isNaN(d)) return String(ts);
  const date = d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "2-digit" });
  return ts.length > 10 ? `${date} · ${d.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit", hour12: false })}` : date;
};
const daysSince = (iso) => (!iso ? 999 : Math.max(0, Math.floor((new Date(today()) - new Date(String(iso).slice(0, 10))) / 86400000)));
const clean = (v) => {
  if (v === true) return "TRUE";
  if (v === false || v == null) return "";
  const s = String(v).trim();
  return /^(tbc|n\/a|na|-|#value!|false)$/i.test(s) ? "" : s;
};
const isTick = (v) => v === true || /^true$/i.test(String(v || "").trim());
const leadId = (org, email, first, last) => (org + "|" + (email || first + last)).toLowerCase().replace(/\s+/g, "");

/* ---------- sheet parsing ---------- */
function rowsToLeads(rows) {
  const map = new Map();
  for (const r of rows) {
    const org = clean(r["Organisation"] || r["Organization"] || r["Company"]);
    if (!org) continue;
    const first = clean(r["First name"] || r["First Name"]);
    const last = clean(r["Surname"] || r["Last name"] || r["Last Name"]);
    const email = clean(r["Email Address"] || r["Email"]).toLowerCase().replace(/^true$/i, "");
    const id = leadId(org, email, first, last);
    let stage = "new";
    let note = "";
    for (const s of STAGES) {
      if (!s.sheetCol) continue;
      const v = r[s.sheetCol];
      if (isTick(v)) stage = s.key;
      else if ((s.key === "won" || s.key === "lost") && clean(v) && !/^(true|false)$/i.test(String(v).trim())) note = clean(v);
    }
    const lt = clean(r["Last touch"] || r["Last Touch"] || r["Last contact"]);
    const lead = {
      id, org, first, last,
      title: clean(r["Job Title"] || r["Title"]),
      email, other: clean(r["Other Contacts"]), sector: clean(r["Sector"]),
      stage,
      sheetNote: note,
      sheetTouch: /^\d{4}-\d{2}-\d{2}/.test(lt) ? lt.slice(0, 10) : null,
    };
    const prev = map.get(id);
    if (prev) {
      if (STAGE_IDX[lead.stage] > STAGE_IDX[prev.stage]) prev.stage = lead.stage;
      for (const k of ["first", "last", "title", "email", "other", "sector", "sheetNote", "sheetTouch"]) if (!prev[k] && lead[k]) prev[k] = lead[k];
    } else map.set(id, lead);
  }
  return [...map.values()];
}

function parseWorkbook(wb, onlyMaster) {
  let rows = [];
  const names = onlyMaster && wb.SheetNames.includes("Customer Master Lead List") ? ["Customer Master Lead List"] : wb.SheetNames;
  for (const name of names) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "" });
    const hIdx = aoa.findIndex((row) => row.some((c) => /organisation|organization/i.test(String(c))));
    if (hIdx === -1) continue;
    const headers = aoa[hIdx].map((h) => String(h).trim());
    for (let i = hIdx + 1; i < aoa.length; i++) {
      const obj = {};
      headers.forEach((h, j) => { if (h) obj[h] = aoa[i][j]; });
      rows.push(obj);
    }
  }
  return rowsToLeads(rows);
}

/* Parse the Apps Script suggestion string into a proposed stage + reason.
   e.g. 'Demo? Calendar event "Opal technology walkthrough"' -> {stage:"demoed", ...} */
function parseSuggestion(text) {
  if (!text) return null;
  const map = [
    [/^demo\??/i, "demoed", "Demo", ""],
    [/price proposal\??|priced prop\??/i, "proposal", "Price Proposal", ""],
    [/closed won\??|^won\??/i, "closed", "Closed Won", "Won"],
    [/closed lost\??|^lost\??/i, "closed", "Closed Lost", "Lost"],
  ];
  // a suggestion field can hold several, separated by '  |  '; take the furthest stage
  const parts = String(text).split("|").map((p) => p.trim()).filter(Boolean);
  let best = null;
  for (const part of parts) {
    for (const [re, stage, label, outcome] of map) {
      if (re.test(part)) {
        if (!best || STAGE_IDX[stage] >= STAGE_IDX[best.stage]) best = { stage, label, outcome, reason: part };
      }
    }
  }
  return best;
}

function nextActionFor(lead) {
  if (isClosed(lead)) return null;
  if (lead.snoozedUntil && lead.snoozedUntil > today()) return null;
  const rule = RULES[lead.stage];
  if (!rule) return null;
  const d = daysSince(lead.lastTouch);
  // cold outreach queue is deliberately NOT every untouched contact. A lead only
  // enters it once someone has given it a temperature above Cold, i.e. decided to pursue it.
  if (lead.stage === "new") {
    if (!lead.email) return null;
    if ((lead.temperature || "Cold") === "Cold") return null;
    return { ...rule, days: d, cold: true };
  }
  if (d < rule.days) return null;
  return { ...rule, days: d, cold: false };
}

function migrateLead(l) {
  if (!l) return l;
  const map = { meeting: "responded", demoed: "demoed", won: "closed", lost: "closed" };
  let stage = l.stage;
  let outcome = l.outcome || "";
  if (stage === "won") { stage = "closed"; outcome = "Won"; }
  else if (stage === "lost") { stage = "closed"; outcome = "Lost"; }
  else if (stage === "meeting") stage = "responded";
  if (STAGE_IDX[stage] == null) stage = "new";
  const owner = OWNERS.includes(l.owner) ? l.owner : (l.owner ? "Other" : "Unassigned");
  return { ...l, stage, outcome, owner, temperature: l.temperature || "Cold" };
}

function seedLeads() {
  return SEED_ROWS.map(([org, first, last, title, email, other, sector, stage, note, outcome, temperature, dealValue, wonQuarter]) => ({
    id: leadId(org, email, first, last),
    org, first, last, title, email, other, sector, stage,
    outcome: outcome || "", temperature: temperature || "Cold",
    targetQuarter: "", dealValue: dealValue || null, wonQuarter: wonQuarter || "",
    owner: "Unassigned", lastTouch: null, snoozedUntil: null,
    notes: note || "", suggestion: "", createdAt: nowIso(), log: [],
  })).filter((l, i, arr) => arr.findIndex((x) => x.id === l.id) === i);
}

    dealValue: l.dealValue || null, wonQuarter: l.wonQuarter || "",
    owner: l.owner || "Unassigned", notes: l.notes || "", suggestion: l.suggestion || "",
    sheetTouch: l.lastTouch || null,
    id: leadId(l.org, l.email, l.first, l.last),
  }));
}

async function pushChange(lead) {
  if (!syncReady()) return;
  try {
    await fetch(SYNC.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: SYNC.token, changes: [{
        org: lead.org, email: lead.email, first: lead.first, last: lead.last,
        stage: lead.stage, outcome: lead.outcome, temperature: lead.temperature,
        targetQuarter: lead.targetQuarter, dealValue: lead.dealValue, wonQuarter: lead.wonQuarter,
        owner: lead.owner, notes: lead.notes, lastTouch: lead.lastTouch,
      }] }),
    });
  } catch (e) { console.error("push failed:", e); }
}
async function loadStored() {
  for (const k of [KEY, "phantm-crm-v1"]) {
    try {
      const r = await window.storage.get(k);
      if (r && r.value) return { key: k, data: JSON.parse(r.value) };
    } catch (e) { /* missing */ }
  }
  return null;
}
let saveTimer = null;
function saveState(state) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await window.storage.set(KEY, JSON.stringify(state)); } catch (e) { console.error("save failed", e); }
  }, 400);
}

function mergeLeads(existing, incoming, { advanceOnly = true } = {}) {
  const map = new Map(existing.map((l) => [l.id, l]));
  let added = 0, moved = 0;
  for (const inc of incoming) {
    const prev = map.get(inc.id);
    if (prev) {
      const patch = { ...prev };
      for (const k of ["first", "last", "title", "email", "other", "sector"]) if (!patch[k] && inc[k]) patch[k] = inc[k];
      if (inc.sheetTouch && (!patch.lastTouch || inc.sheetTouch > patch.lastTouch)) patch.lastTouch = inc.sheetTouch;
      if (inc.sheetNote && !(patch.notes || "").includes(inc.sheetNote)) patch.notes = (patch.notes ? patch.notes + "\n" : "") + inc.sheetNote;
      if (STAGE_IDX[inc.stage] > STAGE_IDX[patch.stage] || (!advanceOnly && inc.stage !== patch.stage)) { patch.stage = inc.stage; moved++; }
      map.set(inc.id, patch);
    } else {
      map.set(inc.id, {
        ...inc, owner: "Unassigned",
        lastTouch: inc.sheetTouch || null, snoozedUntil: null,
        notes: inc.sheetNote || "", createdAt: nowIso(), log: [{ ts: nowIso(), note: "Imported from master list" }],
      });
      added++;
    }
  }
  return { leads: [...map.values()], added, moved };
}

/* ============================================================ */
function PhantmCRM() {
  const [leads, setLeads] = useState(null);
  const [cleared, setCleared] = useState({ date: today(), count: 0 });
  const [syncState, setSyncState] = useState(syncReady() ? "loading" : "off");
  const [view, setView] = useState("today");
  const [analyticsTab, setAnalyticsTab] = useState("overview");
  const [showLost, setShowLost] = useState(false);
  const [dragOverCol, setDragOverCol] = useState(null);
  const [pipeTab, setPipeTab] = useState("board");
  const [ownerFilter, setOwnerFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [openId, setOpenId] = useState(null);
  const [draft, setDraft] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  const [pipeStage, setPipeStage] = useState("contacted");
  const [stageFilter, setStageFilter] = useState("all");
  const [tempFilter, setTempFilter] = useState("all");
  const [aiFor, setAiFor] = useState(null);
  const [toast, setToast] = useState(null);
  const [showCold, setShowCold] = useState(false);
  const [showAll, setShowAll] = useState(false);
  const [skip, setSkip] = useState(0);
  const fileRef = useRef(null);

  useEffect(() => {
    (async () => {
      const stored = await loadStored();
      const seed = seedLeads();
      let base = seed;
      if (stored) {
        const data = stored.data;
        const seedAsIncoming = seed.map((s) => ({ ...s, sheetTouch: null, sheetNote: s.notes }));
        base = mergeLeads((data.leads || []).map(migrateLead), seedAsIncoming).leads.map(migrateLead);
        if (data.cleared && data.cleared.date === today()) setCleared(data.cleared);
      }
      if (syncReady()) {
        try {
          const incoming = await pullFromSheet();
          const merged = mergeLeads(base, incoming, { advanceOnly: false }).leads;
          const byId = Object.fromEntries(incoming.map((x) => [x.id, x]));
          for (const l of merged) {
            const inc = byId[l.id];
            if (inc) {
              l.suggestion = inc.suggestion || ""; l.outcome = inc.outcome || "";
              l.temperature = inc.temperature || "Cold"; l.targetQuarter = inc.targetQuarter || "";
              l.dealValue = inc.dealValue; l.wonQuarter = inc.wonQuarter || "";
              if (inc.sheetTouch) l.lastTouch = inc.sheetTouch;
              if (inc.owner) l.owner = inc.owner;
            }
          }
          setLeads(merged); setSyncState("ok");
        } catch (e) { setLeads(base); setSyncState("error"); }
      } else setLeads(base);
    })();
  }, []);

  useEffect(() => {
    if (!syncReady()) return;
    const id = setInterval(async () => {
      try {
        const incoming = await pullFromSheet();
        setLeads((cur) => {
          if (!cur) return cur;
          const merged = mergeLeads(cur, incoming, { advanceOnly: false }).leads;
          const byId = Object.fromEntries(incoming.map((x) => [x.id, x]));
          for (const l of merged) {
            const inc = byId[l.id];
            if (inc) {
              l.suggestion = inc.suggestion || ""; l.outcome = inc.outcome || "";
              l.temperature = inc.temperature || "Cold";
              l.dealValue = inc.dealValue; l.wonQuarter = inc.wonQuarter || "";
              if (inc.sheetTouch) l.lastTouch = inc.sheetTouch;
            }
          }
          return merged;
        });
        setSyncState("ok");
      } catch (e) { setSyncState("error"); }
    }, SYNC.pollMs);
    return () => clearInterval(id);
  }, []);

  useEffect(() => { if (leads) saveState({ leads, cleared }); }, [leads, cleared]);

  const ping = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };
  const bumpCleared = () => setCleared((c) => (c.date === today() ? { ...c, count: c.count + 1 } : { date: today(), count: 1 }));

  const update = useCallback((id, patch) => {
    setLeads((ls) => {
      const next = ls.map((l) => (l.id === id ? { ...l, ...(typeof patch === "function" ? patch(l) : patch) } : l));
      if (syncReady()) { const ch = next.find((l) => l.id === id); if (ch) pushChange(ch); }
      return next;
    });
  }, []);

  const logAction = (id, note, opts = {}) => {
    update(id, (l) => ({ lastTouch: today(), snoozedUntil: null, log: [{ ts: nowIso(), note }, ...(l.log || [])], ...opts }));
  };

  const noResponse = (lead) => {
    const n = (lead.noReply || 0) + 1;
    update(lead.id, (l) => ({ lastTouch: today(), noReply: n, log: [{ ts: nowIso(), note: `No response (${n}${n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"} time)` }, ...(l.log || [])] }));
    bumpCleared();
    ping(n >= 3 ? "That's " + n + " tries with no reply. Try another contact, or ask AI for a fresh angle." : "Logged. It'll come back around in a few days.");
  };

  const repliedItems = (lead) => {
    const items = [];
    const ni = STAGE_IDX[lead.stage] + 1;
    if (ni < STAGE_IDX.closed) items.push({ label: `Move to ${STAGES[ni].label}`, bold: true, onClick: () => { setStage(lead.id, STAGES[ni].key); bumpCleared(); } });
    items.push({ label: "No response", onClick: () => noResponse(lead) });
    items.push({ label: "Closed won", color: C.deepEmerald, bold: true, onClick: () => { setStage(lead.id, "closed", "Won"); bumpCleared(); } });
    items.push({ label: "Closed lost", color: C.red, onClick: () => { setStage(lead.id, "closed", "Lost"); bumpCleared(); } });
    return items;
  };

  const snoozeItems = (lead) => [
    { label: "1 day", onClick: () => snooze(lead.id, 1) },
    { label: "3 days", onClick: () => snooze(lead.id, 3) },
    { label: "1 week", onClick: () => snooze(lead.id, 7) },
    { label: "1 month", onClick: () => snooze(lead.id, 30) },
  ];

  const setStage = (id, stage, outcome) => {
    const lbl = stage === "closed" && outcome ? `Closed ${outcome}` : STAGES[STAGE_IDX[stage]].label;
    logAction(id, `Stage moved to ${lbl}`, outcome != null ? { stage, outcome } : { stage });
    ping(`Moved to ${lbl}`);
  };

  const snooze = (id, days) => {
    const d = new Date(); d.setDate(d.getDate() + days);
    update(id, { snoozedUntil: d.toISOString().slice(0, 10) });
    ping(`Snoozed ${days} day${days > 1 ? "s" : ""}. It'll come back.`);
  };

  /* ----- import / export ----- */
  const handleFile = async (file) => {
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf);
      const incoming = parseWorkbook(wb, true);
      if (!incoming.length) { ping("No leads found. Check the file has an Organisation column."); return; }
      let summary = "";
      setLeads((existing) => {
        const { leads: merged, added, moved } = mergeLeads(existing, incoming);
        summary = `Synced: ${added} new leads, ${moved} stage updates. Notes and history kept.`;
        return merged;
      });
      setTimeout(() => ping(summary), 50);
      setShowImport(false);
    } catch (e) { ping("Couldn't read that file. Export the sheet as .xlsx and try again."); }
  };

  const exportCsv = async () => {
    const header = ["Organisation", "First name", "Surname", "Job Title", "Email Address", "Other Contacts", "Sector", "Contacted", "Responded", "Demo", "Price Proposal", "Closed", "Outcome", "Temperature", "Target quarter", "Deal value", "Won quarter", "Owner", "Last touch", "Notes"];
    const lines = [header];
    for (const l of leads) {
      const flag = (k) => (STAGE_IDX[l.stage] >= STAGE_IDX[k] ? "TRUE" : "FALSE");
      lines.push([l.org, l.first, l.last, l.title, l.email, l.other, l.sector,
        flag("contacted"), flag("responded"), flag("demoed"), flag("proposal"), flag("closed"),
        l.outcome || "", l.temperature || "", l.targetQuarter || "", l.dealValue || "", l.wonQuarter || "",
        l.owner, l.lastTouch || "", (l.notes || "").replace(/\n/g, " ")]);
    }
    const csv = lines.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const filename = `phantm-master-leads-${today()}.csv`;
    // In the Claude artifact viewer, downloads go through the platform's save prompt;
    // the blob path below covers the self-hosted (GitHub Pages) build.
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) {
      try {
        await dl.save({ filename, data: csv });
        ping("Exported. Import it into the Google Sheet to sync back.");
      } catch (e) {
        if (e && e.code === "declined") ping("Export cancelled.");
        else if (e && e.code === "rate_limited") ping("A save prompt is already open — give it a second and try again.");
        else ping("Export isn't available in this view.");
      }
      return;
    }
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    ping("Exported. Import it into the Google Sheet to sync back.");
  };

  /* ----- derived ----- */
  const filtered = useMemo(() => {
    if (!leads) return [];
    return leads.filter((l) => (ownerFilter === "All" || l.owner === ownerFilter) &&
      (tempFilter === "all" || l.temperature === tempFilter) &&
      (!search || (l.org + " " + l.first + " " + l.last + " " + l.email + " " + l.sector).toLowerCase().includes(search.toLowerCase())));
  }, [leads, ownerFilter, search, tempFilter]);

  const actions = useMemo(() => {
    const out = [];
    for (const l of filtered) { const a = nextActionFor(l); if (a) out.push({ lead: l, action: a }); }
    out.sort((a, b) => b.action.prio - a.action.prio || b.action.days - a.action.days || a.lead.org.localeCompare(b.lead.org));
    return out;
  }, [filtered]);

  const suggestActions = useMemo(() => {
    const out = [];
    for (const l of filtered) {
      if (isClosed(l)) continue;
      if (l.snoozedUntil && l.snoozedUntil > today()) continue;
      const sug = parseSuggestion(l.suggestion);
      // only surface if it proposes moving the deal FORWARD from where it is
      if (sug && STAGE_IDX[sug.stage] >= STAGE_IDX[l.stage]) {
        out.push({ lead: l, suggest: sug });
      }
    }
    out.sort((a, b) => STAGE_IDX[b.suggest.stage] - STAGE_IDX[a.suggest.stage] || a.lead.org.localeCompare(b.lead.org));
    return out;
  }, [filtered]);

  const warmActions = actions.filter((a) => !a.action.cold);
  const coldActions = actions.filter((a) => a.action.cold);
  // suggestions ride at the front of the focus queue: they're confirm-first, one tap to resolve
  const rotated = warmActions.length ? warmActions.slice(skip % warmActions.length).concat(warmActions.slice(0, skip % warmActions.length)) : [];
  const focus = rotated[0];
  const upNext = rotated.slice(1, 4);

  const stats = useMemo(() => {
    if (!leads) return {};
    const open = leads.filter((l) => !isClosed(l));
    const warm = open.filter((l) => STAGE_IDX[l.stage] >= STAGE_IDX.responded);
    return { open: open.length, warm: warm.length, won: leads.filter(isWon).length };
  }, [leads]);

  const openDraft = (lead, templateKey) => {
    const t = TEMPLATES[templateKey](lead);
    setDraft({ lead, templateKey, subject: t.subject, body: t.body });
  };

  if (!leads) return <div style={{ minHeight: "100vh", background: C.bg, display: "grid", placeItems: "center", fontFamily: font.body, color: C.pine }}>Loading your pipeline…</div>;

  const openLead = leads.find((l) => l.id === openId);

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: font.body, color: C.forest }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap');
        * { box-sizing: border-box; }
        input, select, textarea { font-family: 'Inter', sans-serif; }
        input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid ${C.emerald}; outline-offset: 1px; }
        @keyframes pop { 0% { transform: scale(.97); opacity:.5 } 100% { transform: scale(1); opacity:1 } }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
        .pcrm-shell { display: flex; align-items: stretch; min-height: 100vh; }
        .pcrm-side { width: 256px; flex: 0 0 256px; background: ${C.forest}; color: #fff; display: flex; flex-direction: column; gap: 14px; padding: 20px 14px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .pcrm-main { flex: 1 1 auto; min-width: 0; }
        .pcrm-search { width: 100%; padding: 10px 14px 10px 38px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.07); color: #fff; font-size: 13.5px; }

      <div className="pcrm-shell">

      {/* ===== sidebar ===== */}
      <aside className="pcrm-side">
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "0 6px" }}>
          <img src={LOGO} alt="Phantm" style={{ height: 44, display: "block" }} />
          <span style={{ fontFamily: font.display, fontSize: 12.5, fontWeight: 600, color: C.emerald, textTransform: "uppercase", letterSpacing: "0.16em", whiteSpace: "nowrap" }}>Lead Engine</span>
        </div>
        <div style={{ position: "relative", margin: "4px 2px 4px" }}>
          <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", display: "inline-flex", color: "rgba(255,255,255,0.55)", pointerEvents: "none" }}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7" /><path d="M20.5 20.5L16.7 16.7" /></svg>
          </span>
          <input className="pcrm-search" placeholder="Search" value={search} onChange={(e) => setSearch(e.target.value)} />
        </div>
        <nav className="pcrm-nav" style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {[
            ["today", "Today", NavIcons.today, warmActions.length],
            ["pipeline", "Pipeline", NavIcons.pipeline, 0],
            ["contacts", "Contacts", NavIcons.contacts, 0],
            ["leads", "Companies", NavIcons.companies, 0],
            ["analytics", "Analytics", NavIcons.analytics, 0],
          ].map(([k, label, icon, badge]) => {
            const active = view === k;
            return (
              <button key={k} onClick={() => setView(k)} style={{
                display: "flex", alignItems: "center", gap: 12, width: "100%", padding: "9px 12px",
                borderRadius: 999, border: "none", cursor: "pointer", textAlign: "left",
                background: active ? "rgba(255,255,255,0.09)" : "transparent",
                color: active ? "#fff" : "rgba(255,255,255,0.72)", fontFamily: font.body,
              }}>
                <span style={{ width: 34, height: 34, flex: "0 0 34px", borderRadius: active ? 11 : 999, display: "grid", placeItems: "center", background: active ? C.salt : "rgba(255,255,255,0.08)", color: active ? C.forest : "rgba(255,255,255,0.85)", transition: "background .15s" }}>{icon}</span>
                <span style={{ fontSize: 14.5, fontWeight: 600 }}>{label}</span>
                {badge ? <span style={{ marginLeft: "auto", background: C.emerald, color: "#fff", borderRadius: 999, fontSize: 11, fontWeight: 700, padding: "2px 8px" }}>{badge}</span> : null}
              </button>
            );
          })}
        </nav>
      </aside>

      {/* ===== main ===== */}
      <main className="pcrm-main">
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "24px 26px 90px" }}>

        {/* page header */}
        <div style={{ display: "flex", alignItems: "flex-start", gap: 14, flexWrap: "wrap", marginBottom: 22 }}>
          <div style={{ marginRight: "auto", minWidth: 0 }}>
            <h1 style={{ fontFamily: font.display, fontSize: 34, fontWeight: 700, margin: 0, letterSpacing: "-0.01em", color: C.forest }}>{PAGE_META[view].title}</h1>
            <div style={{ color: C.ink60, fontSize: 13.5, marginTop: 3 }}>{PAGE_META[view].sub}</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            {syncState !== "off" && (
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 600, marginRight: 4, color: syncState === "ok" ? C.deepEmerald : syncState === "error" ? C.red : C.ink40 }}>
                <span style={{ width: 8, height: 8, borderRadius: 99, background: syncState === "ok" ? C.emerald : syncState === "error" ? C.red : "rgba(0,26,19,0.25)" }} />
                {syncState === "ok" ? "Live" : syncState === "error" ? "Sync error" : "Connecting…"}
              </span>
            )}
            <Btn kind="primary" onClick={() => setShowAdd(true)}>+ Add lead</Btn>
            <Btn onClick={exportCsv}>Export CSV</Btn>
          </div>
        </div>

        {/* ===== TODAY: focus mode ===== */}
        {view === "today" && (
          <div style={{ maxWidth: 640, margin: "0 auto" }}>
            {/* progress strip */}
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 18, flexWrap: "wrap" }}>
              <div style={{ marginRight: "auto", fontSize: 13.5, color: C.ink60 }}>
                <b style={{ color: C.deepEmerald }}>{cleared.count}</b> cleared today · <b>{warmActions.length}</b> warm waiting
              </div>
              <select value={ownerFilter} onChange={(e) => setOwnerFilter(e.target.value)} style={{ padding: "7px 12px", borderRadius: 999, border: `1px solid rgba(0,26,19,0.35)`, background: "#fff", fontSize: 12.5 }}>
                <option>All</option>{OWNERS.map((o) => <option key={o}>{o}</option>)}
              </select>
            </div>

            {/* confirm-first: stage suggestions detected from Gmail/Calendar */}
            {suggestActions.length > 0 && (
              <div style={{ marginBottom: 18 }}>
                <Eyebrow style={{ color: C.amber, marginBottom: 8 }}>Confirm these — spotted in Gmail &amp; Calendar</Eyebrow>
                <div style={{ display: "grid", gap: 8 }}>
                  {suggestActions.slice(0, 5).map(({ lead, suggest }) => (
                    <div key={lead.id} style={{ background: C.card, border: `1px solid ${C.line}`, borderLeft: `4px solid ${C.amber}`, borderRadius: 10, padding: "11px 14px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                      <div onClick={() => setOpenId(lead.id)} style={{ marginRight: "auto", minWidth: 0, cursor: "pointer" }}>
                        <span style={{ fontWeight: 700, fontSize: 14 }}>{lead.org}</span>
                        <span style={{ color: C.ink60, fontSize: 12.5 }}> — looks like <b style={{ color: C.forest }}>{suggest.label}</b></span>
                        <div style={{ color: C.ink40, fontSize: 11.5, marginTop: 2 }}>{suggest.reason}</div>
                      </div>
                      <Btn small kind="primary" onClick={() => { setStage(lead.id, suggest.stage, suggest.outcome || undefined); update(lead.id, { suggestion: "" }); bumpCleared(); }}>Confirm {suggest.label}</Btn>
                      <Btn small kind="quiet" onClick={() => { update(lead.id, { suggestion: "" }); ping("Dismissed."); }}>Dismiss</Btn>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* THE one thing */}
            {focus ? (
              <div key={focus.lead.id + skip} style={{ background: C.card, border: `1px solid ${C.line}`, borderTop: `5px solid ${C.emerald}`, borderRadius: 14, padding: "22px 22px 18px", boxShadow: "0 6px 24px rgba(0,26,19,0.07)", animation: "pop .18s ease-out" }}>
                <Eyebrow style={{ color: C.deepEmerald, marginBottom: 10 }}>Next up</Eyebrow>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <span onClick={() => setOpenId(focus.lead.id)} style={{ fontFamily: font.display, fontWeight: 700, fontSize: 26, cursor: "pointer" }}>{focus.lead.org}</span>
                  <StageChip stage={focus.lead.stage} outcome={focus.lead.outcome} />
                </div>
                <div style={{ color: C.ink60, fontSize: 13.5, marginTop: 3 }}>
                  {focus.lead.first} {focus.lead.last}{focus.lead.title ? ` · ${focus.lead.title}` : ""}
                </div>
                <p style={{ fontSize: 16, lineHeight: 1.5, margin: "14px 0 18px" }}>
                  <b style={{ color: C.deepEmerald }}>{focus.action.verb}.</b> {focus.action.why(focus.action.days)}
                </p>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                  {focus.lead.email ? (
                    <Btn kind="primary" big onClick={() => openDraft(focus.lead, focus.action.template)}>✉ Draft email</Btn>
                  ) : (
                    <Btn kind="primary" big onClick={() => setOpenId(focus.lead.id)}>Add an email address</Btn>
                  )}
                  <Menu label="Snooze" items={snoozeItems(focus.lead)} />
                  <Btn small kind="quiet" onClick={() => setSkip((s) => s + 1)}>Skip for now →</Btn>
                </div>
                {(focus.lead.noReply || 0) >= 3 && (
                  <div style={{ marginTop: 10, fontSize: 12.5, color: C.red }}>Gone quiet {focus.lead.noReply} times — worth a new angle or another contact. Open the lead and try ✨ AI suggest.</div>
                )}
              </div>
            ) : (
              <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: "40px 24px", textAlign: "center" }}>
                <div style={{ fontSize: 34 }}>🌿</div>
                <div style={{ fontFamily: font.display, fontSize: 22, fontWeight: 700, marginTop: 8 }}>
                  {cleared.count > 0 ? `Queue clear. ${cleared.count} action${cleared.count > 1 ? "s" : ""} handled today.` : "Nothing warm is waiting on you."}
                </div>
                <div style={{ color: C.ink60, fontSize: 14, marginTop: 6 }}>Sync the sheet to pull in new activity, or dip into the cold list below.</div>
              </div>
            )}

            {/* up next: glanceable, no buttons */}
            {upNext.length > 0 && (
              <div style={{ marginTop: 22 }}>
                <Eyebrow style={{ marginBottom: 8 }}>After that</Eyebrow>
                <div style={{ display: "grid", gap: 6 }}>
                  {upNext.map(({ lead, action }) => (
                    <div key={lead.id} onClick={() => setOpenId(lead.id)} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 10, padding: "10px 14px", display: "flex", alignItems: "center", gap: 10, cursor: "pointer", flexWrap: "wrap" }}>
                      <span style={{ fontWeight: 600, marginRight: "auto" }}>{lead.org}</span>
                      <span style={{ color: C.ink60, fontSize: 12.5 }}>{action.verb}</span>
                      <StageChip stage={lead.stage} outcome={lead.outcome} />
                    </div>
                  ))}
                </div>
                {warmActions.length > 4 && (
                  <button onClick={() => setShowAll(!showAll)} style={{ background: "none", border: "none", cursor: "pointer", padding: "10px 0 0", color: C.deepEmerald, fontSize: 13, fontWeight: 600 }}>
                    {showAll ? "Hide the rest ▲" : `Show all ${warmActions.length} warm actions ▼`}
                  </button>
                )}
                {showAll && (
                  <div style={{ display: "grid", gap: 6, marginTop: 8 }}>
                    {rotated.slice(4).map(({ lead, action }) => (
                      <div key={lead.id} onClick={() => setOpenId(lead.id)} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 10, padding: "9px 14px", display: "flex", alignItems: "center", gap: 10, cursor: "pointer", flexWrap: "wrap" }}>
                        <span style={{ fontWeight: 600, marginRight: "auto", fontSize: 13.5 }}>{lead.org}</span>
                        <span style={{ color: C.ink60, fontSize: 12 }}>{action.verb}</span>
                        <StageChip stage={lead.stage} outcome={lead.outcome} />
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* cold queue: tucked away */}
            <div style={{ marginTop: 28 }}>
              <button onClick={() => setShowCold(!showCold)} style={{ background: "none", border: "none", cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 8 }}>
                <Eyebrow>Cold outreach ({coldActions.length})</Eyebrow>
                <span style={{ color: C.ink40, fontSize: 12 }}>{showCold ? "▲" : "▼"}</span>
              </button>
              {showCold && (
                <div style={{ display: "grid", gap: 6, marginTop: 10 }}>
                  {coldActions.slice(0, 20).map(({ lead }) => (
                    <div key={lead.id} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 10, padding: "9px 14px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                      <div style={{ marginRight: "auto", minWidth: 0 }}>
                        <span style={{ fontWeight: 600, fontSize: 13.5 }}>{lead.org}</span>
                        <span style={{ color: C.ink60, fontSize: 12.5 }}> · {lead.first} {lead.last}{lead.sector ? ` · ${lead.sector}` : ""}</span>
                      </div>
                      <Btn small onClick={() => openDraft(lead, "cold")}>Draft email</Btn>
                    </div>
                  ))}
                  {coldActions.length > 20 && <div style={{ color: C.ink40, fontSize: 12.5 }}>+ {coldActions.length - 20} more in Companies</div>}
                  <div style={{ color: C.ink40, fontSize: 12, marginTop: 10, lineHeight: 1.5, flexBasis: "100%" }}>Only leads you have warmed above Cold appear here. To queue more, set a temperature on them in Companies.</div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* ===== PIPELINE: kanban board ===== */}
        {view === "pipeline" && (() => {
          const wonLeads = filtered.filter(isWon);
          const openLeads = filtered.filter((l) => !isClosed(l) && l.stage !== "new");
          const openValue = openLeads.reduce((a, l) => a + (l.dealValue || 0), 0);
          const wonValue = wonLeads.reduce((a, l) => a + (l.dealValue || 0), 0);
          const cols = [
            { key: "new", label: "New", dot: "#9AA39E" },
            { key: "contacted", label: "Contacted", dot: "#5B7C8D" },
            { key: "responded", label: "Responded", dot: "#7C6FD0" },
            { key: "demoed", label: "Demo", dot: "#2AA8C4" },
            { key: "proposal", label: "Price Proposal", dot: "#B8860B" },
            { key: "won", label: "Won", dot: C.emerald },
          ].concat(showLost ? [{ key: "lost", label: "Lost", dot: C.red }] : []);
          const colLeads = (key) => filtered.filter((l) => key === "won" ? isWon(l) : key === "lost" ? isLost(l) : l.stage === key)
            .slice().sort((a, b) => (b.dealValue || 0) - (a.dealValue || 0) || a.org.localeCompare(b.org));
          const dropLead = (id, key) => {
            const l = leads.find((x) => x.id === id);
            if (!l) return;
            if (key === "won") { if (!isWon(l)) setStage(id, "closed", "Won"); }
            else if (key === "lost") { if (!isLost(l)) setStage(id, "closed", "Lost"); }
            else if (l.stage !== key || isClosed(l)) setStage(id, key);
          };
          return (
          <div>
            <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
              {[["board", "Board"], ["list", "List"]].map(([k, label]) => (
                <button key={k} onClick={() => setPipeTab(k)} style={{
                  fontFamily: font.display, textTransform: "uppercase", letterSpacing: "0.08em", fontSize: 12.5, fontWeight: 700,
                  padding: "8px 16px", borderRadius: 999, cursor: "pointer",
                  background: pipeTab === k ? C.forest : C.card, color: pipeTab === k ? C.salt : C.pine,
                  border: `1px solid ${pipeTab === k ? "transparent" : "rgba(0,26,19,0.35)"}`,
                }}>{label}</button>
              ))}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>

                <b style={{ color: C.forest }}>{openLeads.length}</b> active lead{openLeads.length === 1 ? "" : "s"} · <b style={{ color: C.amber }}>{money(openValue) || "$0"}</b> open · <b style={{ color: C.deepEmerald }}>{money(wonValue) || "$0"}</b> won
              </div>
              {pipeTab === "board" && (
              <button onClick={() => setShowLost(!showLost)} style={{
                display: "inline-flex", alignItems: "center", gap: 6, padding: "7px 15px", borderRadius: 999, cursor: "pointer",
                background: showLost ? C.forest : "#fff", color: showLost ? "#fff" : C.pine,
                border: `1px solid ${showLost ? "transparent" : "rgba(0,26,19,0.35)"}`, fontSize: 12.5, fontWeight: 600, fontFamily: font.body,
              }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 5h16l-6 7v6l-4 2v-8L4 5z" /></svg>
                {showLost ? "Hide lost" : "Show lost"}
              </button>
              )}
            </div>
            {pipeTab === "list" && (() => {
              const pills = [
                { key: "new", label: "New" }, { key: "contacted", label: "Contacted" }, { key: "responded", label: "Responded" },
                { key: "demoed", label: "Demo" }, { key: "proposal", label: "Price Proposal" }, { key: "won", label: "Won" }, { key: "lost", label: "Lost" },
              ];
              const inStage = colLeads(pipeStage);
              const stageLabel = (pills.find((p) => p.key === pipeStage) || pills[0]).label;
              return (
                <div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
                    {pills.map((s) => {
                      const n = colLeads(s.key).length;
                      const active = pipeStage === s.key;
                      return (
                        <button key={s.key} onClick={() => setPipeStage(s.key)} style={{
                          fontFamily: font.display, textTransform: "uppercase", letterSpacing: "0.08em", fontSize: 12.5, fontWeight: 700,
                          padding: "9px 14px", borderRadius: 999, cursor: "pointer",
                          background: active ? (s.key === "won" ? C.emerald : s.key === "lost" ? C.red : C.forest) : C.card,
                          color: active ? C.salt : C.pine,
                          border: `1px solid ${active ? "transparent" : "rgba(0,26,19,0.35)"}`,
                        }}>{s.label} <span style={{ opacity: 0.65, fontWeight: 500 }}>{n}</span></button>
                      );
                    })}
                  </div>
                  {!inStage.length ? (
                    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 28, textAlign: "center", color: C.ink60 }}>
                      No leads sitting in {stageLabel} right now.
                    </div>
                  ) : (
                    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, overflow: "hidden" }}>
                      {inStage.map((l) => {
                        const a = nextActionFor(l);
                        return (
                          <div key={l.id} onClick={() => setOpenId(l.id)} style={{ padding: "11px 16px", borderBottom: `1px solid ${C.faint}`, display: "flex", alignItems: "center", gap: 12, cursor: "pointer", flexWrap: "wrap" }}>
                            <div style={{ marginRight: "auto", minWidth: 0 }}>
                              <div style={{ fontWeight: 600, fontSize: 14 }}>{l.org}</div>
                              <div style={{ color: C.ink60, fontSize: 12.5 }}>{l.first} {l.last}{l.title ? ` · ${l.title}` : ""}{l.owner !== "Unassigned" ? ` · ${l.owner}` : ""}</div>
                            </div>
                            <span style={{ color: C.red, fontSize: 12, fontWeight: 600, minWidth: 150 }}>{a && !a.cold ? `● ${a.verb}` : ""}</span>
                            <span style={{ fontSize: 13, fontWeight: 600, minWidth: 58, textAlign: "right" }}>{l.dealValue ? money(l.dealValue) : ""}</span>
                            <span style={{ color: C.ink40, fontSize: 12, minWidth: 96, textAlign: "right" }}>{l.lastTouch ? `${daysSince(l.lastTouch)}d ago` : "no touch logged"}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })()}
            {pipeTab === "board" && (
            <div className="pcrm-kb" style={{ display: "flex", gap: 12, overflowX: "auto", alignItems: "flex-start", paddingBottom: 10 }}>
              {cols.map((c) => {
                const inCol = colLeads(c.key);
                const colValue = inCol.reduce((a, l) => a + (l.dealValue || 0), 0);
                const over = dragOverCol === c.key;
                return (
                  <div key={c.key}
                    onDragOver={(e) => { e.preventDefault(); if (dragOverCol !== c.key) setDragOverCol(c.key); }}
                    onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverCol(null); }}
                    onDrop={(e) => { e.preventDefault(); setDragOverCol(null); const id = e.dataTransfer.getData("text/plain"); if (id) dropLead(id, c.key); }}
                    style={{
                      flex: "0 0 232px", width: 232, minWidth: 0, maxWidth: 232, borderRadius: 20, padding: "12px 10px 10px",
                      background: over ? "rgba(28,186,136,0.08)" : "rgba(0,26,19,0.045)",
                      border: `1.5px solid ${over ? C.emerald : "rgba(0,26,19,0.35)"}`,
                      display: "flex", flexDirection: "column", maxHeight: "64vh", boxSizing: "border-box",
                    }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "0 4px" }}>
                      <span style={{ width: 8, height: 8, borderRadius: 99, background: c.dot, flex: "0 0 8px" }} />
                      <span style={{ fontWeight: 700, fontSize: 13, color: C.forest, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.label}</span>
                      <span style={{ fontSize: 12, color: C.ink40, fontWeight: 600 }}>{inCol.length}</span>
                      <button onClick={() => setShowAdd(true)} title="Add a lead" style={{ marginLeft: "auto", background: "none", border: "none", cursor: "pointer", color: C.ink40, fontSize: 16, lineHeight: 1, padding: "0 2px" }}>+</button>
                    </div>
                    <div style={{ fontSize: 12, fontWeight: 700, color: colValue ? C.amber : C.ink40, padding: "4px 4px 8px", borderBottom: `1px solid ${C.line}` }}>{money(colValue) || "$0"}</div>
                    <div className="pcrm-kb" style={{ overflowY: "auto", overflowX: "hidden", display: "grid", gap: 8, paddingTop: 10, minHeight: 64, minWidth: 0 }}>
                      {inCol.length === 0 && (
                        <div style={{ border: `1.5px dashed rgba(0,26,19,0.2)`, borderRadius: 12, padding: "22px 10px", textAlign: "center", color: C.ink40, fontSize: 12 }}>Drop leads here</div>
                      )}
                      {inCol.map((l) => {
                        const a = nextActionFor(l);
                        return (
                          <div key={l.id} draggable
                            onDragStart={(e) => { e.dataTransfer.setData("text/plain", l.id); e.dataTransfer.effectAllowed = "move"; }}
                            onClick={() => setOpenId(l.id)}
                            style={{ background: "#fff", borderRadius: 12, border: `1px solid ${C.line}`, padding: "9px 11px", cursor: "grab", boxShadow: "0 1px 3px rgba(0,26,19,0.06)", minWidth: 0 }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                              <span style={{ color: C.ink40, fontSize: 11, letterSpacing: "1px", flex: "0 0 auto" }}>⠿</span>
                              <span style={{ fontWeight: 600, fontSize: 13, color: C.forest, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: "1 1 auto", minWidth: 0 }}>{l.org}</span>
                              {a && !a.cold && <span title={a.verb} style={{ marginLeft: "auto", width: 7, height: 7, borderRadius: 99, background: C.red, flex: "0 0 7px" }} />}
                            </div>
                            {(l.first || l.last) && <div style={{ color: C.ink60, fontSize: 11.5, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{(l.first + " " + l.last).trim()}</div>}
                            {l.dealValue ? (

        {/* ===== CONTACTS: people on file ===== */}
        {view === "contacts" && (() => {
          const rows = filtered.filter((l) => (l.first || l.last || l.email)).slice()
            .sort((a, b) => (STAGE_IDX[b.stage] ?? 0) - (STAGE_IDX[a.stage] ?? 0) || ((a.first || "") + (a.last || "")).localeCompare((b.first || "") + (b.last || "")));

            <div>
              <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>

                <Eyebrow>contacts on file</Eyebrow>

                {(ownerFilter !== "All" || tempFilter !== "all" || search) && (
                  <Btn small kind="quiet" onClick={() => { setOwnerFilter("All"); setTempFilter("all"); setSearch(""); }}>Clear filters</Btn>

              <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
                {rows.map((l) => (

                    <span style={{ width: 34, height: 34, flex: "0 0 34px", borderRadius: 999, background: "rgba(28,186,136,0.14)", color: C.deepEmerald, display: "grid", placeItems: "center", fontWeight: 700, fontSize: 12.5, fontFamily: font.display }}>
                      {(((l.first || " ")[0] || "") + ((l.last || " ")[0] || "")).trim().toUpperCase() || "@"}
                    </span>
                    <div style={{ flex: "1 1 220px", minWidth: 0 }}>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{((l.first || "") + " " + (l.last || "")).trim() || l.email}</div>
                      <div style={{ color: C.ink60, fontSize: 12.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{[l.title, l.email].filter(Boolean).join(" · ") || "no details on file"}</div>
                    </div>
                    <span style={{ color: C.pine, fontSize: 13, fontWeight: 600 }}>{l.org}</span>
                  </div>
                ))}
                {rows.length === 0 && <div style={{ padding: 24, color: C.ink60 }}>No contacts match. Clear the filters or sync from the sheet.</div>}
              </div>
            </div>
          );
        })()}

        {/* ===== ANALYTICS: overview + forecast ===== */}
        {view === "analytics" && (
          <div>
            <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
              {[["overview", "Overview"], ["forecast", "Forecast"]].map(([k, label]) => (
                <button key={k} onClick={() => setAnalyticsTab(k)} style={{
                  fontFamily: font.display, textTransform: "uppercase", letterSpacing: "0.08em", fontSize: 12.5, fontWeight: 700,
                  padding: "8px 16px", borderRadius: 999, cursor: "pointer",
                  background: analyticsTab === k ? C.forest : C.card, color: analyticsTab === k ? C.salt : C.pine,
                  border: `1px solid ${analyticsTab === k ? "transparent" : "rgba(0,26,19,0.35)"}`,

              ))}

            {analyticsTab === "overview"
              ? <Insights leads={filtered} />
              : <Forecast leads={filtered} allLeads={leads} setOpenId={setOpenId} />}

            <div style={{ display: "flex", gap: 10, marginBottom: 12, flexWrap: "wrap" }}>

              <select value={stageFilter} onChange={(e) => setStageFilter(e.target.value)} style={{ padding: "8px 12px", borderRadius: 999, border: `1px solid ${stageFilter !== "all" ? C.emerald : "rgba(0,26,19,0.35)"}`, background: "#fff", fontSize: 13, fontWeight: stageFilter !== "all" ? 600 : 400 }}>
                <option value="all">All stages</option>
                {STAGES.map((s) => <option key={s.key} value={s.key}>{s.key === "new" ? "New (untouched)" : s.label}</option>)}
              </select>
              <select value={ownerFilter} onChange={(e) => setOwnerFilter(e.target.value)} style={{ padding: "8px 12px", borderRadius: 999, border: `1px solid ${ownerFilter !== "All" ? C.emerald : "rgba(0,26,19,0.35)"}`, background: "#fff", fontSize: 13, fontWeight: ownerFilter !== "All" ? 600 : 400 }}>
                <option>All</option>{OWNERS.map((o) => <option key={o}>{o}</option>)}
              </select>
              <select value={tempFilter} onChange={(e) => setTempFilter(e.target.value)} style={{ padding: "8px 12px", borderRadius: 999, border: `1px solid ${tempFilter !== "all" ? C.emerald : "rgba(0,26,19,0.35)"}`, background: "#fff", fontSize: 13, fontWeight: tempFilter !== "all" ? 600 : 400 }}>
                <option value="all">All temperatures</option>
                {TEMPS.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            {(() => {
              const shown = filtered.filter((l) => stageFilter === "all" || l.stage === stageFilter).length;
              const total = (leads || []).length;
              return (
                <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 20, fontWeight: 700, color: C.forest, lineHeight: 1.1 }}>{shown}</span>
                  <Eyebrow>{shown === total ? "companies in the book" : `of ${total} companies`}</Eyebrow>
                  {(stageFilter !== "all" || ownerFilter !== "All" || tempFilter !== "all" || search) && (
                    <Btn small kind="quiet" onClick={() => { setStageFilter("all"); setOwnerFilter("All"); setTempFilter("all"); setSearch(""); }}>Clear filters</Btn>
                  )}
                </div>
              );
            })()}
            <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 16px", borderBottom: `1px solid ${C.line}`, background: C.faint }}>
                <Eyebrow style={{ flex: "1 1 200px", minWidth: 0 }}>Company</Eyebrow>
                <Eyebrow style={{ minWidth: 104 }}>Assigned</Eyebrow>
                <Eyebrow style={{ minWidth: 188, textAlign: "right" }}>Deal stage</Eyebrow>
              </div>
              {filtered.filter((l) => stageFilter === "all" || l.stage === stageFilter).slice().sort((a, b) => (STAGE_IDX[b.stage] ?? 0) - (STAGE_IDX[a.stage] ?? 0) || a.org.localeCompare(b.org)).map((l) => (
                <div key={l.id} style={{ padding: "10px 16px", borderBottom: `1px solid ${C.faint}`, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <div onClick={() => setOpenId(l.id)} style={{ flex: "1 1 200px", minWidth: 0, cursor: "pointer" }}>
                    <div style={{ fontWeight: 600, fontSize: 14 }}>{l.org}</div>
                    <div style={{ color: C.ink60, fontSize: 12.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{[(l.first + " " + l.last).trim(), l.title, l.email].filter(Boolean).join(" · ") || "no contact details"}</div>
                  </div>
                  <select value={l.owner || "Unassigned"} onClick={(e) => e.stopPropagation()} onChange={(e) => update(l.id, { owner: e.target.value })}
                    title="Owner — who is accountable for the next step"
                    style={{ padding: "5px 8px", borderRadius: 8, border: `1px solid ${l.owner && l.owner !== "Unassigned" ? C.line : "rgba(192,73,44,0.45)"}`, background: "#fff", fontSize: 12.5, fontWeight: l.owner && l.owner !== "Unassigned" ? 600 : 400, color: l.owner && l.owner !== "Unassigned" ? C.forest : C.red, cursor: "pointer", minWidth: 104 }}>
                    {OWNERS.map((o) => <option key={o} value={o}>{o}</option>)}
                  </select>
                  <div onClick={() => setOpenId(l.id)} style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 10, cursor: "pointer", minWidth: 188 }}>
                    <StageDots stage={l.stage} outcome={l.outcome} />
                    <span style={{ width: 118, display: "inline-flex", justifyContent: "center" }}>
                      <StageChip stage={l.stage} outcome={l.outcome} />
                    </span>
                  </div>
                </div>
              ))}
              {filtered.filter((l) => stageFilter === "all" || l.stage === stageFilter).length === 0 && <div style={{ padding: 24, color: C.ink60 }}>No leads match. Clear the filters or sync from the sheet.</div>}
            </div>
          </div>
        )}
      </div>
      </main>
      </div>

      {/* ===== lead drawer ===== */}
      {openLead && (
        <Drawer onClose={() => setOpenId(null)}>
          <LeadDetail lead={openLead} update={update} setStage={setStage} openDraft={openDraft} snooze={snooze} logAction={logAction} onAi={() => setAiFor(openLead)} />
        </Drawer>
      )}

      {/* ===== AI suggestion drawer ===== */}
      {aiFor && (
        <Drawer onClose={() => setAiFor(null)}>
          <AISuggest
            lead={leads.find((l) => l.id === aiFor.id) || aiFor}
            onUseEmail={(email) => { setDraft({ lead: aiFor, templateKey: "ai", subject: email.subject, body: email.body }); setAiFor(null); }}
            onLog={(note) => logAction(aiFor.id, note)}
          />
        </Drawer>
      )}

      {/* ===== draft modal ===== */}
      {draft && (
        <Drawer onClose={() => setDraft(null)}>
          <div>
            <Eyebrow style={{ marginBottom: 6 }}>Email draft — {draft.lead.org}</Eyebrow>
            <div style={{ fontSize: 13, color: C.ink60, marginBottom: 14 }}>To: {draft.lead.email || "no email on file"}</div>
            <label style={{ fontSize: 12, fontWeight: 600, color: C.ink60 }}>Subject</label>
            <input value={draft.subject} onChange={(e) => setDraft({ ...draft, subject: e.target.value })} style={{ width: "100%", padding: "9px 12px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 14, margin: "4px 0 12px", background: "#fff" }} />
            <label style={{ fontSize: 12, fontWeight: 600, color: C.ink60 }}>Message</label>
            <textarea value={draft.body} onChange={(e) => setDraft({ ...draft, body: e.target.value })} rows={11} style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 14, lineHeight: 1.5, margin: "4px 0 14px", resize: "vertical", background: "#fff" }} />
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {draft.lead.email && (
                <Btn kind="primary" onClick={() => {
                  window.open(`mailto:${draft.lead.email}?subject=${encodeURIComponent(draft.subject)}&body=${encodeURIComponent(draft.body)}`);
                  logAction(draft.lead.id, `Email sent: ${draft.subject}`);
                  bumpCleared(); setDraft(null); ping("✓ Sent and logged. Next one up.");
                }}>Open in email & log</Btn>
              )}
              <Btn onClick={async () => {
                try { await navigator.clipboard.writeText(`Subject: ${draft.subject}\n\n${draft.body}`); } catch (e) {}
                logAction(draft.lead.id, `Email sent: ${draft.subject}`);
                bumpCleared(); setDraft(null); ping("✓ Copied and logged. Next one up.");
              }}>Copy & log as sent</Btn>
              <Btn kind="quiet" onClick={() => setDraft(null)}>Cancel</Btn>
            </div>
          </div>
        </Drawer>
      )}

      {/* ===== import modal ===== */}
      {showImport && (
        <Drawer onClose={() => setShowImport(false)}>
          <div>
            <Eyebrow style={{ marginBottom: 8 }}>Sync from the master sheet</Eyebrow>
            <p style={{ fontSize: 14, lineHeight: 1.6, color: C.pine }}>
              In the Google Sheet go to <b>File → Download → Microsoft Excel (.xlsx)</b>, then drop the file here.
              The <b>Customer Master Lead List</b> tab is read, tick boxes set stages, duplicates merge, and if a <b>Last touch</b> column exists (the Gmail script adds one) it powers the reminders.
              Re-syncing is always safe: notes, owners and history are kept, and stages only move forward.
            </p>
            <div
              onClick={() => fileRef.current?.click()}
              onDragOver={(e) => e.preventDefault()}
              onDrop={(e) => { e.preventDefault(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); }}
              style={{ border: `2px dashed ${C.emerald}`, borderRadius: 12, padding: "38px 20px", textAlign: "center", cursor: "pointer", background: "rgba(28,186,136,0.05)", marginTop: 12 }}
            >
              <div style={{ fontWeight: 600, color: C.deepEmerald }}>Drop the .xlsx here</div>
              <div style={{ fontSize: 12.5, color: C.ink60, marginTop: 4 }}>or click to choose a file</div>
            </div>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }} onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])} />
          </div>
        </Drawer>
      )}

      {/* ===== add lead ===== */}
      {showAdd && (
        <Drawer onClose={() => setShowAdd(false)}>
          <AddLead
            onCancel={() => setShowAdd(false)}
            onSave={(form) => {
              const id = leadId(form.org, form.email, form.first, form.last);
              const exists = leads.find((l) => l.id === id);
              if (exists) { setShowAdd(false); setOpenId(id); ping(`${form.org} is already in the engine — opened it for you.`); return; }
              setLeads((ls) => [{
                id, ...form, other: "", snoozedUntil: null,
                lastTouch: form.stage === "new" ? null : today(),
                createdAt: nowIso(), log: [{ ts: nowIso(), note: "Added manually" }],
              }, ...ls]);
              setShowAdd(false);
              ping(`${form.org} added${form.stage !== "new" ? " to " + STAGES[STAGE_IDX[form.stage]].label : ""}.`);
            }}
          />
        </Drawer>
      )}

      {toast && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: C.forest, color: C.salt, padding: "11px 20px", borderRadius: 10, fontSize: 13.5, boxShadow: "0 8px 24px rgba(0,26,19,0.25)", zIndex: 60, maxWidth: "90vw" }}>{toast}</div>
      )}
    </div>
  );
}

/* ---------- drawer ---------- */
function Drawer({ children, onClose }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,26,19,0.4)", zIndex: 50, display: "flex", justifyContent: "flex-end" }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "min(520px, 100%)", height: "100%", background: C.bg, padding: "22px 22px 40px", overflowY: "auto", boxShadow: "-12px 0 40px rgba(0,26,19,0.18)" }}>
        <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: C.ink60, fontSize: 14, padding: 0, marginBottom: 14, fontWeight: 600 }}>← Back</button>
        {children}
      </div>
    </div>
  );
}

/* ---------- AI suggestions (Claude API) ---------- */
function AISuggest({ lead, onUseEmail, onLog }) {
  const [state, setState] = useState({ loading: true, error: null, result: null });

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const history = (lead.log || []).slice(0, 6).map((e) => `${fmtTs(e.ts || e.date)}: ${e.note}`).join("\n") || "none";
        const prompt = `You are a B2B sales advisor for Phantm, "the packaging data layer" for regulated supply chains, predominantly Australian businesses. Phantm helps brands, retailers and manufacturers structure packaging data at SKU level (material, mass, movement) for compliance and reporting: APCO, PREP, and state-based packaging regulation.

Lead:
- Organisation: ${lead.org}
- Contact: ${lead.first} ${lead.last}${lead.title ? ", " + lead.title : ""}
- Sector: ${lead.sector || "unknown"}
- Pipeline stage: ${STAGES[STAGE_IDX[lead.stage]].label}
- Days since last touch: ${lead.lastTouch ? daysSince(lead.lastTouch) : "never contacted / not logged"}
- Times they've gone quiet: ${lead.noReply || 0}
- Notes: ${lead.notes || "none"}
- Recent history:
${history}

Give a re-engagement plan to move this deal forward. Consider: a fresh angle (APCO/PREP reporting deadlines, sector-specific compliance pressure), whether to switch channel (LinkedIn, phone) or contact, and timing.

Respond with ONLY valid JSON, no markdown fences, in exactly this shape:
{"angle": "one sentence: the sharpest hook for this specific lead", "steps": ["2-4 short concrete next steps"], "email": {"subject": "subject line", "body": "email under 110 words, warm concise professional UK/AU English, no em dashes, greeting using first name, sign-off 'Best,' with no name"}}`;

        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
        });
        const data = await res.json();
        const text = (data.content || []).map((i) => i.text || "").join("");
        const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
        if (alive) setState({ loading: false, error: null, result: parsed });
      } catch (e) {
        if (alive) setState({ loading: false, error: "Couldn't reach the AI right now. Try again in a moment.", result: null });
      }
    })();
    return () => { alive = false; };
  }, [lead.id]);

  return (
    <div>
      <Eyebrow style={{ marginBottom: 6, color: C.deepEmerald }}>✨ AI suggestion — {lead.org}</Eyebrow>
      <div style={{ fontSize: 12.5, color: C.ink60, marginBottom: 16 }}>
        {STAGES[STAGE_IDX[lead.stage]].label}{lead.lastTouch ? ` · last touch ${daysSince(lead.lastTouch)}d ago` : " · no touch logged"}{(lead.noReply || 0) > 0 ? ` · gone quiet ×${lead.noReply}` : ""}
      </div>

      {state.loading && (
        <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: 28, textAlign: "center", color: C.ink60, fontSize: 14 }}>
          Reading the history and thinking…
        </div>
      )}

      {state.error && (
        <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: 20, color: C.red, fontSize: 13.5 }}>{state.error}</div>
      )}

      {state.result && (
        <div style={{ display: "grid", gap: 14 }}>
          <div style={{ background: C.card, border: `1px solid ${C.line}`, borderLeft: `4px solid ${C.emerald}`, borderRadius: 12, padding: "14px 16px" }}>
            <Eyebrow style={{ marginBottom: 6 }}>The angle</Eyebrow>
            <div style={{ fontSize: 15, lineHeight: 1.5, fontWeight: 500 }}>{state.result.angle}</div>
          </div>

          <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "14px 16px" }}>
            <Eyebrow style={{ marginBottom: 8 }}>Suggested plan</Eyebrow>
            <div style={{ display: "grid", gap: 8 }}>
              {(state.result.steps || []).map((s, i) => (
                <div key={i} style={{ display: "flex", gap: 10, fontSize: 13.5, lineHeight: 1.45 }}>
                  <span style={{ color: C.emerald, fontWeight: 700 }}>→</span><span>{s}</span>
                </div>
              ))}
            </div>
          </div>

          {state.result.email && (
            <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: "14px 16px" }}>
              <Eyebrow style={{ marginBottom: 8 }}>Suggested email</Eyebrow>
              <div style={{ fontSize: 13.5, fontStyle: "italic", marginBottom: 8 }}>{state.result.email.subject}</div>
              <div style={{ fontSize: 13.5, lineHeight: 1.55, whiteSpace: "pre-wrap", color: C.pine }}>{state.result.email.body}</div>
              <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                <Btn kind="primary" small onClick={() => onUseEmail(state.result.email)}>Use this email</Btn>
                <Btn small kind="quiet" onClick={() => { onLog("AI plan noted: " + state.result.angle); }}>Save angle to history</Btn>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

      <input value={form[key]} placeholder={placeholder || ""} onChange={set(key)}

  return (
    <div>
      <Eyebrow style={{ marginBottom: 12 }}>Add a lead</Eyebrow>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 100%" }}>
          <label style={{ fontSize: 11.5, fontWeight: 600, color: C.ink40, textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: font.display }}>Organisation *</label>
          <input value={form.org} onChange={set("org")} placeholder="e.g. MECCA" autoFocus
            style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 15, marginTop: 3, background: "#fff", fontWeight: 600 }} />
        </div>
        {input("First name", "first")}
        {input("Surname", "last")}
        {input("Job title", "title")}
        {input("Email", "email", "unlocks email drafts")}
        {input("Sector", "sector", "FMCG, Retail, Apparel…")}
        <div style={{ flex: "1 1 45%" }}>
          <label style={{ fontSize: 11.5, fontWeight: 600, color: C.ink40, textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: font.display }}>Owner</label>
          <select value={form.owner} onChange={set("owner")} style={{ width: "100%", padding: "9px 11px", borderRadius: 8, border: `1px solid ${C.line}`, fontSize: 13.5, marginTop: 3, background: "#fff" }}>
